name: Static security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Static security regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run standard-library security checks
        run: python3 scripts/security_audit.py
